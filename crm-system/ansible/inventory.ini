[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_become=yes
ansible_become_method=sudo

# Database credentials
db_password=secure_crm_password_2024
db_name=crm_prod
db_user=crm_user

# Redis configuration
redis_password=secure_redis_password_2024

# JWT configuration
jwt_secret=your_super_secret_jwt_key_for_crm_2024

# Email configuration
smtp_host=smtp.gmail.com
smtp_port=587
smtp_user=your_email@gmail.com
smtp_pass=your_app_password

[app]
# Application Server (4 vCPU, 8GB RAM)
# Frontend + Backend + Nginx
app-server ansible_host=YOUR_APP_SERVER_IP
# Example: app-server ansible_host=185.178.208.123

[db]
# Database Server (2 vCPU, 4GB RAM)
# PostgreSQL + Redis
db-server ansible_host=YOUR_DB_SERVER_IP
# Example: db-server ansible_host=185.178.208.124

[monitoring]
# Monitoring Server (2 vCPU, 2GB RAM)
# Prometheus + Grafana
monitoring-server ansible_host=YOUR_MONITORING_SERVER_IP
# Example: monitoring-server ansible_host=185.178.208.125

[production:children]
app
db
monitoring

[production:vars]
environment=production
deploy_user=ubuntu
app_port=3000
backend_port=3001
db_port=5432
redis_port=6379
grafana_port=3000
prometheus_port=9090
node_exporter_port=9100

# Network configuration
private_network=10.0.0.0/24
app_private_ip=10.0.0.10
db_private_ip=10.0.0.11
monitoring_private_ip=10.0.0.12

# Backup configuration
backup_retention_days=30
backup_schedule="0 2 * * *"  # Daily at 2 AM

# Monitoring configuration
prometheus_retention_days=15
grafana_admin_password=admin123
alerting_enabled=true
telegram_bot_token=YOUR_TELEGRAM_BOT_TOKEN
telegram_chat_id=YOUR_TELEGRAM_CHAT_ID
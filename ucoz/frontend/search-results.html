<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты поиска - Ticket Aggregator</title>
    <meta name="description" content="Результаты поиска билетов">
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-gradient { background: linear-gradient(to right, #2563eb, #16a34a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200; }
        .btn-secondary { @apply bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-lg transition-colors duration-200; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent; }
        .card { @apply bg-white rounded-xl shadow-sm border border-gray-200 p-6; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-gradient-to-r from-blue-600 to-green-600 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gradient">TicketAggregator</span>
                    </a>
                </div>

                <!-- Navigation -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-blue-600 transition-colors">Главная</a>
                    <a href="#" class="text-blue-600 font-medium">Поиск</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition-colors">О нас</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600 transition-colors">Контакты</a>
                </nav>

                <!-- Auth Buttons -->
                <div class="hidden md:flex items-center space-x-4" id="authButtons">
                    <button onclick="showLoginModal()" class="btn-secondary">Войти</button>
                    <button onclick="showRegisterModal()" class="btn-primary">Регистрация</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search Summary -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-2xl font-bold text-gray-900">Результаты поиска</h1>
                <a href="index.html" class="text-blue-600 hover:text-blue-700 text-sm">Изменить поиск</a>
            </div>
            
            <div id="searchSummary" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm text-gray-600">
                <!-- Search summary will be populated by JavaScript -->
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Фильтры</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Цена</label>
                    <select id="priceFilter" class="input-field">
                        <option value="">Любая цена</option>
                        <option value="0-5000">До 5 000 ₽</option>
                        <option value="5000-10000">5 000 - 10 000 ₽</option>
                        <option value="10000-20000">10 000 - 20 000 ₽</option>
                        <option value="20000+">Более 20 000 ₽</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Время вылета</label>
                    <select id="timeFilter" class="input-field">
                        <option value="">Любое время</option>
                        <option value="00:00-06:00">Ночь (00:00-06:00)</option>
                        <option value="06:00-12:00">Утро (06:00-12:00)</option>
                        <option value="12:00-18:00">День (12:00-18:00)</option>
                        <option value="18:00-24:00">Вечер (18:00-24:00)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Количество пересадок</label>
                    <select id="stopsFilter" class="input-field">
                        <option value="">Любое количество</option>
                        <option value="0">Без пересадок</option>
                        <option value="1">1 пересадка</option>
                        <option value="2+">2+ пересадки</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Сортировка</label>
                    <select id="sortFilter" class="input-field">
                        <option value="price">По цене</option>
                        <option value="duration">По времени в пути</option>
                        <option value="departure">По времени вылета</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="searchResults" class="space-y-4">
            <!-- Results will be populated by JavaScript -->
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6-4h6m2 5.291A7.962 7.962 0 0112 15c-2.34 0-4.29-1.009-5.824-2.562M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Билеты не найдены</h3>
            <p class="text-gray-600 mb-4">Попробуйте изменить параметры поиска</p>
            <a href="index.html" class="btn-primary">Новый поиск</a>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-md w-full p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Вход в систему</h3>
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="email" class="input-field" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                        <input type="password" name="password" class="input-field" required>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="hideLoginModal()" class="btn-secondary">Отмена</button>
                        <button type="submit" class="btn-primary">Войти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-md w-full p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Регистрация</h3>
                <form id="registerForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Имя</label>
                        <input type="text" name="first_name" class="input-field">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Фамилия</label>
                        <input type="text" name="last_name" class="input-field">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="email" class="input-field" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                        <input type="password" name="password" class="input-field" required>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" onclick="hideRegisterModal()" class="btn-secondary">Отмена</button>
                        <button type="submit" class="btn-primary">Зарегистрироваться</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/search-results.js"></script>
</body>
</html>

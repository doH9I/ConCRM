version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ticket_aggregator_db
    environment:
      POSTGRES_DB: ticket_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ticket_network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: ticket_aggregator_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticket_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_aggregator_backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticket_aggregator
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ticket_network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_aggregator_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ticket_network
    command: npm run dev
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ticket_aggregator_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - ticket_network

volumes:
  postgres_data:
  redis_data:

networks:
  ticket_network:
    driver: bridge